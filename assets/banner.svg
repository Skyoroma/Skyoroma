<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hi, I'm Alexis</title>
  <desc id="d">A passionate developer from France</desc>
  <style>
    .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .glyphe { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #EEF1F8; opacity: 0; animation: monte linear infinite; }
    @keyframes monte {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: .14; } 85% { opacity: .14; }
      100% { transform: translateY(-420px); opacity: 0; }
    }
    .derive { animation: derive 16s linear infinite; }
    @keyframes derive { to { transform: translate(28px, 28px); } }
    .halo { transform-box: fill-box; transform-origin: center; animation: respire 14s ease-in-out infinite; }
    .halo.r { animation-delay: -7s; }
    @keyframes respire { 0%,100% { transform: scale(1) translate(0,0); } 50% { transform: scale(1.15) translate(30px,15px); } }
    .etincelle { fill: #EEF1F8; transform-box: fill-box; transform-origin: center; animation: scintille 3.2s ease-in-out infinite; }
    @keyframes scintille {
      0%,100% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1) rotate(90deg); opacity: .9; }
    }
    .filante { opacity: 0; animation: file 9s ease-in infinite; }
    @keyframes file {
      0% { transform: translate(0,0); opacity: 0; }
      2% { opacity: 1; }
      13% { transform: translate(-420px, 210px); opacity: 0; }
      100% { transform: translate(-420px, 210px); opacity: 0; }
    }
    .curseur { animation: clignote 1.1s steps(1) infinite; }
    @keyframes clignote { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .glyphe, .filante { display: none; } }
  </style>
