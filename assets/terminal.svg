    .curseur { animation: clignote 1s steps(1) infinite; }
    @keyframes clignote { 50% { opacity: 0; } }
    .lueur { animation: lueur 7s ease-in-out infinite; }
    @keyframes lueur { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(420px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } }
  </style>
