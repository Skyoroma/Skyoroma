  <title id="t">Terminal: about Alexis</title>
  <desc id="d">Stack: PHP, Symfony, Twig, Tailwind, HTML, CSS, JS, MySQL, MongoDB, Docker. Currently working on web apps with Symfony and Tailwind CSS, and learning something new every day.</desc>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace; font-size: 20px; }
