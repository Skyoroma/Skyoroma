  <title id="t">Terminal: about Alexis</title>
  <desc id="d">whoami: Alexis, a passionate developer from France. Stack: PHP, Symfony, Twig, Tailwind, HTML, CSS, JS, MySQL, MongoDB, Docker. Currently working on web apps with Symfony and Tailwind CSS, and learning something new every day.</desc>
